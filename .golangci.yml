# golangci-lint configuration
# See: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default linters
    - errcheck        # Checks for unchecked errors
    - gosimple        # Simplifies code
    - govet           # Reports suspicious constructs
    - ineffassign     # Detects unused variable assignments
    - staticcheck     # Advanced static analysis
    - unused          # Finds unused code

    # Additional recommended linters
    - bodyclose       # Checks whether HTTP response body is closed
    - copyloopvar     # Detects loop variable copy issues
    - dupl            # Detects code duplication
    - errname         # Checks error naming conventions (ErrFoo)
    - exhaustive      # Checks exhaustiveness of enum switch statements
    - goconst         # Finds repeated strings that could be constants
    - gocritic        # Opinionated meta-linter with many checks
    - gocyclo         # Measures cyclomatic complexity
    - gofmt           # Checks code formatting
    - goimports       # Checks import ordering and formatting
    - gosec           # Security-focused linter
    - misspell        # Finds common misspellings
    - nakedret        # Finds naked returns in large functions
    - nilerr          # Finds code returning nil after checking error
    - prealloc        # Suggests slice pre-allocation
    - revive          # Fast, configurable, extensible linter (golint replacement)
    - unconvert       # Removes unnecessary type conversions
    - unparam         # Reports unused function parameters
    - whitespace      # Detects leading/trailing whitespace

  settings:
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
        - name: unused-parameter

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
